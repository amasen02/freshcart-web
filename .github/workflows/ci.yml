# ---------------------------------------------------------------------------
# CI for the FreshCart customer storefront (Angular 20).
# Lints, runs unit tests headless, builds the production bundle and uploads it.
# On master the bundle is packaged into a hardened nginx image and pushed to GHCR.
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (ChromeHeadless)
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Build (production)
        run: npm run build -- --configuration production

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: freshcart-web-dist
          path: dist/freshcart-customer/browser
          if-no-files-found: error

  container:
    name: Container · Scan · Push
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: tags
        run: echo "shortSha=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load locally for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/freshcart-web:${{ steps.tags.outputs.shortSha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test runtime container as non-root
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/freshcart-web:${{ steps.tags.outputs.shortSha }}
        run: |
          set -euo pipefail
          container_name=freshcart-web-smoke
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "nginx"
          docker run --detach --name "$container_name" --publish 18080:80 "$IMAGE" >/dev/null

          for attempt in {1..30}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_name")"
            if [ "$health" = "healthy" ]; then
              curl --fail --silent --show-error http://127.0.0.1:18080/ >/dev/null
              exit 0
            fi
            if [ "$health" = "unhealthy" ]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 1
          done

          docker logs "$container_name"
          exit 1

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/freshcart-web:${{ steps.tags.outputs.shortSha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-spa'

      - name: Push to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/freshcart-web:${{ steps.tags.outputs.shortSha }}
            ghcr.io/${{ github.repository_owner }}/freshcart-web:run-${{ github.run_number }}
            ghcr.io/${{ github.repository_owner }}/freshcart-web:latest
